# Example configuration for the groups service.
#
# Values may also be supplied via environment variables prefixed with GROUPS_
# (e.g. GROUPS_KEYCLOAK_CLIENT_SECRET) or a dotenv file.

# Group storage. Groups, membership, and their effective-membership closure live
# in the permissions schema of the DE database, alongside the tables the
# permissions service owns. The schema is applied as a connection-level
# search_path, so it does not need to be set in the URI.
#
# The connection-pool settings are optional; each falls back to the default
# shown when it is absent. Creating a group holds its transaction open across an
# HTTP call to the permissions service, so max-open-conns also bounds how many
# slow creates can occupy the pool at once. conn-max-lifetime recycles
# connections, which is how a rotated credential or a failed-over primary is
# picked up without a restart -- set it as a duration, not a bare number.
db:
  uri: postgresql://de:notprod@dedb:5432/de?sslmode=disable
  schema: permissions
  max-open-conns: 25
  max-idle-conns: 5
  conn-max-lifetime: 5m

# Caps one member listing. A listing without an explicit limit is refused rather
# than truncated when the group is larger than this: group-propagator replaces an
# iRODS group's membership from that response, so a page mistaken for the whole
# list would delete everyone past it. Every user member also costs one directory
# lookup, so this bounds request duration as well as response size.
groups:
  max-member-listing: 1000

# Domain appended to a bare username to form the public.users.username of the
# corresponding DE user, used to correlate a new subject with its DE user row.
# Leave unset to use the default (@iplantcollaborative.org).
users:
  suffix: "@iplantcollaborative.org"

# Where the display names, emails and institutions reported for members come
# from: "keycloak" (the default) or "portal-conductor".
#
# Both read the same people -- Keycloak federates the directory portal-conductor
# queries directly -- but portal-conductor answers a whole member listing in one
# request, where Keycloak has no bulk lookup by username and costs one call per
# member. It also reports the institution, which reaches Keycloak only if the
# realm carries an LDAP attribute mapper for `o`.
userinfo:
  backend: keycloak

# Only read when userinfo.backend is portal-conductor.
portal-conductor:
  base-url: https://portal-conductor
  username: groups
  password: changeme

# Keycloak connection settings. The service authenticates as a confidential
# client using the client-credentials grant. Keycloak is only the source of user
# attributes -- names, email addresses, and institutions -- so the service
# account needs permission to read users, not to manage groups.
keycloak:
  base-url: https://keycloak.example.org/auth
  realm: example
  client-id: groups-service
  client-secret: changeme

# Base URL of the DE permissions service used for group authorization.
permissions:
  base: http://permissions

# AMQP settings for publishing group-change (reindex) events.
amqp:
  uri: amqp://guest:guest@rabbit:5672/
  exchange: de

# Trusted service accounts that bypass ALL per-group permission checks. Listed
# accounts have full administrative control over every group: reading and
# modifying membership, updating or deleting any group, and managing group
# permissions. List only fully trusted internal DE services (e.g. the
# permissions service). Leave empty to disable the bypass entirely.
admin:
  users: []
