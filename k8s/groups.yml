apiVersion: apps/v1
kind: Deployment
metadata:
  name: groups
spec:
  replicas: 2
  selector:
    matchLabels:
      de-app: groups
  template:
    metadata:
      labels:
        de-app: groups
    spec:
      serviceAccount: configurator
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: de-app
                    operator: In
                    values:
                      - groups
              topologyKey: kubernetes.io/hostname
      restartPolicy: Always
      volumes:
        - name: service-configs
          secret:
            secretName: service-configs
            items:
              - key: groups.yml
                path: groups.yml
      containers:
        - name: groups
          image: harbor.cyverse.org/de/groups
          args:
            - "--config=/etc/cyverse/de/configs/groups.yml"
            - "--log-level=info"
          env:
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: timezone
                  key: timezone
            - name: GROUPS_KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: configs
                  key: GROUPS_KEYCLOAK_CLIENT_SECRET
          resources:
            requests:
              cpu: "1m"
              memory: "128Mi"
              ephemeral-storage: "1Gi"
            limits:
              cpu: "100m"
              memory: "256Mi"
              ephemeral-storage: "1Gi"
          volumeMounts:
            - name: service-configs
              mountPath: /etc/cyverse/de/configs
              readOnly: true
          ports:
            - name: listen-port
              containerPort: 60000
          livenessProbe:
            httpGet:
              path: /
              port: 60000
            initialDelaySeconds: 5
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: 60000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: groups
spec:
  selector:
    de-app: groups
  ports:
    - protocol: TCP
      port: 80
      targetPort: listen-port
